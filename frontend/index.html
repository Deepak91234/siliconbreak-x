<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>SiliconBreak X</title>
    <script>
      // Dark is the primary theme; apply a saved "light" choice before first paint (App.tsx owns it afterwards).
      (function () { var light = false; try { light = localStorage.getItem("siliconbreak.theme") === "light"; } catch (e) {} if (!light) document.documentElement.classList.add("dark"); })();
    </script>
  </head>
  <body class="bg-bg text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
